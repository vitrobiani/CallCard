# .github/workflows/deploy.yml
name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main  # or master, whatever your default branch is

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'  # pin to your version if needed
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/"

      - name: Deploy to GitHub Pages repo
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key"
      
          # Clone the pages repo
          git clone git@github.com:vitrobiani/vitrobiani.github.io.git /tmp/pages
      
          # Clear it out (preserving .git and CNAME)
          find /tmp/pages -mindepth 1 -not -path '/tmp/pages/.git*' -not -name 'CNAME' -delete
      
          # Copy the build output
          cp -r build/web/. /tmp/pages/
      
          # Commit and push
          cd /tmp/pages
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from ${{ github.sha }}"
          git push

